name: Update Profile Assets

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate activity graph (dark)
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: aymenelouadi
          options: "theme=tokyo-night&hide_border=true&bg_color=00000000&area=true&point=8a2be2"
          output_path: dist/activity-graph-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate activity graph (light)
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: aymenelouadi
          options: "theme=minimal&hide_border=true&bg_color=ffffff&area=true&point=8a2be2"
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: aymenelouadi
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish assets to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}